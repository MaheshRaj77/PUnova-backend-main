services:
  - type: web
    name: punova-backend
    runtime: node
    region: singapore
    plan: free
    
    # Build Configuration
    buildCommand: npm install && npm run seed:all
    startCommand: npm start
    
    # Health Check Configuration
    healthCheckPath: /api/v1/health
    healthCheckInterval: 10
    healthCheckTimeout: 5
    
    # Auto Deploy - pushes to GitHub trigger automatic deployment
    autoDeploy: true
    
    # Environment Variables
    envVars:
      # ═════════════════════════════════════════════════════════════
      # SERVER CONFIGURATION (Fixed Values)
      # ═════════════════════════════════════════════════════════════
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      
      # ═════════════════════════════════════════════════════════════
      # DATABASE CONFIGURATION (Neon PostgreSQL)
      # ═════════════════════════════════════════════════════════════
      # Set DATABASE_URL in Render Dashboard
      - key: DATABASE_URL
        sync: false
      
      # ═════════════════════════════════════════════════════════════
      # JWT AUTHENTICATION
      # ═════════════════════════════════════════════════════════════
      # Generate with: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 7d
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_EXPIRY
        value: 30d
      
      # ═════════════════════════════════════════════════════════════
      # FILE STORAGE (Cloudinary)
      # ═════════════════════════════════════════════════════════════
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      
      # ═════════════════════════════════════════════════════════════
      # CACHING & RATE LIMITING (Upstash Redis)
      # ═════════════════════════════════════════════════════════════
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      
      # ═════════════════════════════════════════════════════════════
      # CORS CONFIGURATION
      # ═════════════════════════════════════════════════════════════
      # Format: https://example.com,https://app.example.com
      - key: ALLOWED_ORIGINS
        sync: false
      
      # ═════════════════════════════════════════════════════════════
      # ADMIN / FACULTY SEED ACCOUNTS
      # ═════════════════════════════════════════════════════════════
      - key: ADMIN_EMAILS
        value: bala@pondiuni.ac.in
      - key: FACULTY_EMAILS
        value: mahesh@pondiuni.ac.in
      - key: SEED_PASSWORD
        sync: false
      
      # ═════════════════════════════════════════════════════════════
      # FIREBASE (Push Notifications & Analytics)
      # ═════════════════════════════════════════════════════════════
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      
      # ═════════════════════════════════════════════════════════════
      # EMAIL CONFIGURATION (Optional - Email Notifications)
      # ═════════════════════════════════════════════════════════════
      # Leave empty if not using email functionality
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      
      # ═════════════════════════════════════════════════════════════
      # ADMIN ACCOUNT SETUP (Created on first deploy)
      # ═════════════════════════════════════════════════════════════
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
